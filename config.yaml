# Strategy, universe, and risk-gate configuration for the VRP-harvesting agent.
# All numeric limits here are read by risk/gates.py as hard, deterministic caps —
# the LLM layer cannot override anything in this file.

account:
  starting_balance: 100000.0

universe:
  # NOTE: alpaca_quant_agent/universe.py is the source of truth consumed by the
  # cycle (ALL_ENTRIES); this block is kept in sync for reference. Expanded from
  # 10 -> 22 names across multiple sectors so that (a) more symbols clear the
  # IV-rank entry gate on any given day, and (b) the concentration gate has
  # genuinely uncorrelated buckets to diversify across (see CORRELATION_BUCKETS).
  core_etfs:
    - SPY
    - QQQ
    - IWM
    - XLF   # financials sector
    - XLE   # energy sector
    - GLD   # gold (non-equity diversifier)
  # Curated quality / liquid names eligible for Sleeve A + Sleeve B.
  # Rationale for each lives in alpaca_quant_agent/universe.py (not duplicated here).
  quality_single_names:
    - AAPL
    - MSFT
    - NVDA
    - GOOGL
    - AMZN
    - META
    - AVGO
    - JPM    # financials
    - V      # financials
    - MA     # financials
    - LLY    # healthcare
    - UNH    # healthcare
    - COST   # consumer
    - HD     # consumer
    - WMT    # consumer
    - XOM    # energy

signals:
  iv_rank_lookback_days: 63
  # DEMO SETTING: relaxed from 40 -> 30 so the agent will actually open
  # positions in calmer vol regimes for demonstration. Lowering this does NOT
  # increase per-trade max loss (still capped at 2%/trade); it trades a thinner
  # VRP edge for more frequent entries. Production value is 40+. Do not go
  # below ~20 -- that is selling genuinely cheap volatility with little edge.
  iv_rank_entry_threshold: 30   # percentile, sleeve A entries require IV rank >= this
  iv_rank_earnings_threshold: 80  # percentile, sleeve B entries require IV rank >= this
  momentum_lookback_days: 252   # ~12 months
  momentum_skip_days: 21        # skip most recent month (12-1 momentum)
  ema_fast: 20
  ema_slow: 50
  adx_period: 14
  adx_trend_threshold: 20       # ADX < this => no-trend regime => iron condor
  # +/- band around the underlying price for option contract/chain requests.
  # Required to avoid silently-truncated results on daily-expiring
  # underlyings (e.g. SPY) where an unbounded strike range can return
  # thousands of contracts -- see execution/alpaca_mcp.py::get_option_contracts.
  option_strike_band_pct: 0.25

# Volatility-term-structure exposure scaler (signals.vol_term_structure_regime).
# Reads a front-vs-longer-dated vol ratio (VIX / VIX3M by default) and scales
# ALL new short-premium exposure by a multiplier in [0, 1]. Short-vol is safe
# to press in contango (near-term calm) and most dangerous in backwardation
# (acute near-term stress) -- this presses the gas in calm regimes and pumps
# the brakes when the curve inverts. Applied to fractional-Kelly sizing and
# the portfolio heat budget in the screener.
vol_term_structure:
  enabled: true
  front_symbol: VIX            # near-term implied vol index
  back_symbol: VIX3M           # ~3-month implied vol index (longer-dated)
  contango_ratio: 0.95         # ratio <= this => full exposure (multiplier 1.0)
  backwardation_ratio: 1.00    # ratio >= this => labelled "backwardation" (log only)
  floor_ratio: 1.10            # ratio >= this => min_exposure_multiplier (deepest throttle)
  min_exposure_multiplier: 0.0 # floor: 0.0 = stop opening new premium when deeply inverted
  # Exposure ramps linearly 1.0 -> min_exposure_multiplier as the front/back
  # vol ratio rises from contango_ratio to floor_ratio (one continuous curve).

strategy:
  sleeve_a:
    target_dte_min: 30
    target_dte_max: 45
    short_delta_target: 0.22
    short_delta_band: 0.05      # accept short strikes within +/- this of target
    spread_width_etf: 5.0
    spread_width_single_name: 5.0
    take_profit_pct_of_credit: 0.50   # close at 50% of max profit captured
    stop_loss_multiple_of_credit: 2.0 # close if loss reaches 2x credit received
    time_stop_dte: 21
    earnings_blackout_days: 3         # skip/close if earnings within N calendar days
  sleeve_b_earnings:
    max_days_to_earnings: 2
    min_iv_rank: 80
    close_next_session: true

black_scholes:
  # This paper account has no OPRA market-data subscription, so Alpaca's
  # option endpoints return quotes but no greeks/IV -- we invert IV and
  # compute delta/vega ourselves (strategy/black_scholes.py). Constant
  # risk-free-rate approximation (short-term T-bill proxy); a live curve is
  # out of scope for this competition build.
  risk_free_rate: 0.045

sizing:
  kelly_fraction: 0.3           # fractional Kelly multiplier applied to full Kelly
  # Assumed additive edge of realized win-rate over the delta-implied (risk-neutral)
  # win probability, reflecting the volatility risk premium (IV > subsequent RV on
  # average -- Carr & Wu 2009; Bakshi & Kapadia 2003). Conservative starting value;
  # revisit once the live ledger has enough trades to estimate this empirically.
  assumed_win_prob_edge: 0.04

risk_gates:
  max_risk_per_trade_pct: 0.02       # of equity, defined max loss of the spread
  max_portfolio_heat_pct: 0.20       # of equity, sum of max loss across open positions
  # Concentration gate: cap aggregate defined-risk within one correlation
  # bucket (see universe.CORRELATION_BUCKETS). Positions in the same bucket
  # (e.g. QQQ + the mega-cap tech single names) largely share one risk driver
  # and lose together, so this stops the book from piling the whole heat
  # budget into what is effectively a single bet. Must be <= portfolio heat.
  max_bucket_heat_pct: 0.10          # of equity, sum of max loss within one bucket
  max_positions_per_underlying: 1
  max_total_positions: 12
  sleeve_b_max_allocation_pct: 0.15  # of equity, aggregate max loss in sleeve B
  portfolio_delta_band_pct: 0.05     # of equity in $-delta terms
  portfolio_vega_cap_pct: 0.03       # of equity in $-vega terms
  daily_loss_halt_pct: -0.03
  total_drawdown_kill_switch_pct: -0.10
  min_open_interest: 100
  max_bid_ask_spread_pct: 0.15       # of mid price

scheduler:
  cycle_interval_minutes: 15
  timezone: America/New_York
